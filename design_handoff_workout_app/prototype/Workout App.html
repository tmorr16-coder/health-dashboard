<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout App</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { height: 100%; }
  body {
    background: #2c2925;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.02), transparent 50%);
    display: grid;
    place-items: center;
    padding: 24px 0;
  }
  .frame-wrap { width: 100%; max-width: 430px; aspect-ratio: 9/19.5; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="phone-shell" style="
  position: relative;
  width: 390px;
  height: 844px;
  background: #1a1714;
  border-radius: 54px;
  padding: 14px;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.5),
    0 1px 0 rgba(255,255,255,0.06) inset,
    0 -1px 0 rgba(0,0,0,0.3) inset;
">
  <div style="
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: var(--bg, #f4f1ec);
    isolation: isolate;
  ">
    <!-- Status bar -->
    <div style="
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 30px 8px; z-index: 100;
      font-family: -apple-system, system-ui;
      font-weight: 600; font-size: 15px; color: var(--ink, #16140f);
      pointer-events: none;
    ">
      <span>9:41</span>
      <span style="display: inline-flex; gap: 5px; align-items: center;">
        <svg width="16" height="11" viewBox="0 0 16 11"><path d="M1 8h2v2H1zm4-2h2v4H5zm4-2h2v6H9zm4-2h2v8h-2z" fill="currentColor"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11"><rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="currentColor" fill="none" opacity="0.4"/><rect x="2" y="2" width="15" height="7" rx="1" fill="currentColor"/><rect x="19.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.4"/></svg>
      </span>
    </div>
    <!-- Notch -->
    <div style="
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 32px;
      background: #000; border-radius: 18px; z-index: 110;
    "></div>

    <!-- App content -->
    <div id="root" style="position: absolute; inset: 0; padding-top: 44px; display: flex; flex-direction: column;"></div>

    <!-- Home indicator -->
    <div style="
      position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; background: var(--ink, #16140f);
      opacity: 0.35; border-radius: 3px; z-index: 100; pointer-events: none;
    "></div>
  </div>
</div>

<script>
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "accent": "#b84a2e"
  }/*EDITMODE-END*/;
</script>

<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="body.jsx"></script>
<script type="text/babel" src="chart.jsx"></script>
<script type="text/babel" src="screens-today.jsx"></script>
<script type="text/babel" src="screens-train.jsx"></script>
<script type="text/babel" src="screens-progress.jsx"></script>
<script type="text/babel" src="builder.jsx"></script>
<script type="text/babel" src="screens-auth.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
